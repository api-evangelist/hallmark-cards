description: >-
  Hallmark Cards, Inc. is a privately held, family-owned greeting card, gift, gift wrap and
  ornament company headquartered in Kansas City, Missouri, founded in 1910 by J.C. Hall. Its
  portfolio spans Hallmark greeting cards and Keepsake Ornaments sold through Hallmark Gold Crown
  stores and mass retailers, the Crayola and Hallmark Business Connections (B2B greeting card
  programs) subsidiaries, and Hallmark Media (Hallmark Channel, Hallmark+). Hallmark publishes no
  public developer program: developer.hallmark.com does not resolve, api.hallmark.com serves a
  stock ASP.NET template with no documented endpoints, and no OpenAPI, GraphQL, MCP, A2A agent
  card, llms.txt or /.well-known discovery document was found on any Hallmark host on 2026-09-17.
  Retail and supply-chain partners integrate through bilateral EDI (Hallmark Global Services) and
  Hallmark Business Connections' CRM/SSO integrations, none of which are documented publicly.
