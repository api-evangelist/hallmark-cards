x-evidence:
  verified: '2026-09-17'
  method: probed every host, searched the web, read the Business Connections and corporate sites
  summary: >-
    No API entry is listed because none could be evidenced. Web search for a Hallmark Cards developer
    API returns only unrelated projects (the Nxt blockchain "Hallmark" API, a third-party
    nondracek/hallmark-api scraper). The GitHub org HallmarkCards (Hallmark Cards UK) has 0 public
    repos and github.com/hallmark is an unrelated individual. Hallmark Business Connections markets
    CRM and SSO integrations for its B2B card programs but publishes no integration reference.
    Hallmark Global Services trades with retailers over EDI through TrueCommerce (a third-party
    network, 403 to our crawler). Hallmark is privately held, so there are no SEC EDGAR filings to
    list as a third-party government API.
