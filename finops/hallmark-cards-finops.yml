description: 'FOCUS-aligned FinOps placeholder for Hallmark Cards: no public commercial API. The
  shape below treats partner integration as a contract-bundled subscription with allocation meters
  for retail / supply-chain integration.'
notes: No public commercial model is published. Reconcile against an actual partner agreement.
sources:
  - https://www.hallmark.com/
principles:
  - name: Visibility
    description: Track partner-integration request volume via the Hallmark partner gateway logs.
  - name: Allocation
    description: Allocate integration cost across retail channels (own-brand stores, big-box,
      e-commerce) using the calling system identifier.
  - name: Optimization
    description: Cache catalog and inventory lookups; batch order updates; consolidate retailer
      integrations through a single channel.
  - name: Accountability
    description: Designate a partner-program owner; review API utilization quarterly.
