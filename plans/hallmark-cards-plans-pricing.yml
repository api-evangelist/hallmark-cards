specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Hallmark Cards
providerId: hallmark-cards
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Greeting Cards
  - Gift
  - Retail
description: Hallmark Cards is a privately held US greeting-card and gift retailer. There is no
  public developer API, pricing page, or partner-program plan catalog published on hallmark.com.
  Any API access is via bilateral retail / partner integration.
notes: No public pricing or developer plans are available. The single placeholder Enterprise plan
  records the expected commercial shape; reconcile against a partner agreement if one exists.
sources:
  - https://www.hallmark.com/
plans:
  - id: hallmark-cards-enterprise
    name: Enterprise / Partner
    type: enterprise
    description: Bilateral partner agreement for retail / supply-chain integration. Contract-defined
      volumes and SLAs.
    entries:
      - label: Plan price
        description: Custom-quoted via the partner agreement
        name: plan_price
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: configurable
        domains:
          - https://api.hallmark.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Partner Account Manager
      - name: Hallmark Cards API
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
