description: >-
  Hallmark Cards publishes no API plans, developer pricing, or partner-program plan catalog. The
  company is a privately held greeting-card, gift and media business with no public developer
  program: developer.hallmark.com does not resolve and api.hallmark.com serves a stock ASP.NET
  template. Hallmark Business Connections sells B2B card programs (volume-priced card packs, CRM
  and SSO integrations) and Hallmark Global Services trades with retailers over EDI, both under
  bilateral commercial agreements rather than a published API tier.
